# 训练配置文件
# 模型配置
model_path: "models/BAGEL-7B-MoT"
layer_module: "Qwen2MoTDecoderLayer"
max_latent_size: 64

# 恢复和微调配置
resume_from: "models/BAGEL-7B-MoT"
finetune_from_hf: true
auto_resume: true
resume_model_only: true
finetune_from_ema: true

# 训练超参数
lr: 2e-5
total_steps: 1001
warmup_steps: 0
log_every: 10
save_every: 100

# 数据处理配置
num_worker: 1
expected_num_tokens: 8192
max_num_tokens: 12288
max_num_tokens_per_sample: 8192

# 分片策略配置
sharding_strategy: "HYBRID_SHARD"
num_shard: 8

# 这些参数需要在脚本中单独指定
# wandb_name: "run-mahjong-ichihime-extension-thinking-0926-t2i-vlm-nebula-2"
# checkpoint_dir: "results/checkpoints/mahjong_ichihime_extension_thinking_0926_t2i_vlm_nebula"
wandb_offline: True